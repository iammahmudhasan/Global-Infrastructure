server:
  listen_addr: "0.0.0.0:8080"
  node_id: "pop-sin-01"
  region: "ap-southeast-1"
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
    - "172.28.0.0/16"
    - "172.30.0.0/16"

upstream:
  origins:
    - address: "185.232.14.188"
      port: 443
      protocol: "HTTPS"
      sni: "aeitron.com"
  routes:
    - host: "edge.aeitron.com"
      origins:
        - address: "185.232.14.188"
          port: 443
          protocol: "HTTPS"
          sni: "aeitron.com"
    - host: "aeitron.com"
      origins:
        - address: "185.232.14.188"
          port: 443
          protocol: "HTTPS"
          sni: "aeitron.com"
    - host: "www.aeitron.com"
      origins:
        - address: "185.232.14.188"
          port: 443
          protocol: "HTTPS"
          sni: "aeitron.com"
    - host: "api.aeitron.com"
      origins:
        - address: "185.232.14.188"
          port: 443
          protocol: "HTTPS"
          sni: "api.aeitron.com"
    - host: "api.nexusedge.io"
      path_routes:
        - path_prefix: "/status/"
          priority: 10
          origins:
            - address: "185.232.14.188"
              port: 443
              protocol: "HTTPS"
              sni: "api.nexusedge.io"
        - path_prefix: "/"
          priority: 0
          origins:
            - address: "185.232.14.188"
              port: 443
              protocol: "HTTPS"
              sni: "api.nexusedge.io"
    - host: "app.nexusedge.io"
      origins:
        - address: "185.232.14.188"
          port: 443
          protocol: "HTTPS"
          sni: "app.nexusedge.io"
  health_check_path: "/"
  timeout_ms: 5000

control_plane:
  enabled: false
  endpoint: "http://127.0.0.1:9091"
  pop_id: "singapore"
  poll_interval_secs: 30

rate_limit:
  enabled: true
  requests_per_second: 100
  burst_capacity: 200

waf:
  enabled: true
  block_sqli: true
  block_xss: true
  block_path_traversal: true

cache:
  enabled: true
  default_ttl_seconds: 60
  max_entries: 10000

ai:
  enabled: true
  route_prefix: "/v1"
  providers: []
