server:
  listen_addr: "0.0.0.0:8080"
  node_id: "pop-sin-01"
  region: "ap-southeast-1"

upstream:
  targets:
    - "https://httpbin.org"
  routes:
    - host: "api.nexusedge.io"
      targets:
        - "https://httpbin.org"
    - host: "app.nexusedge.io"
      targets:
        - "https://httpbin.org"
    - host: "customer-a.example.com"
      targets:
        - "https://httpbin.org"
  health_check_path: "/status/200"
  timeout_ms: 5000

control_plane:
  enabled: false
  endpoint: "http://127.0.0.1:8081"
  pop_id: "singapore"
  poll_interval_secs: 30

rate_limit:
  enabled: true
  requests_per_second: 100
  burst_capacity: 200

waf:
  enabled: true
  block_sqli: true
  block_xss: true
  block_path_traversal: true

cache:
  enabled: true
  default_ttl_seconds: 60
  max_entries: 10000
