server:
  listen_addr: "0.0.0.0:8080"
  node_id: "pop-sin-01"
  region: "ap-southeast-1"

upstream:
  origins:
    - address: "54.159.186.149"
      port: 443
      protocol: "HTTPS"
      sni: "httpbin.org"
  routes:
    - host: "api.nexusedge.io"
      path_routes:
        - path_prefix: "/status/"
          priority: 10
          origins:
            - address: "54.159.186.149"
              port: 443
              protocol: "HTTPS"
              sni: "httpbin.org"
        - path_prefix: "/"
          priority: 0
          origins:
            - address: "54.159.186.149"
              port: 443
              protocol: "HTTPS"
              sni: "httpbin.org"
    - host: "app.nexusedge.io"
      origins:
        - address: "54.159.186.149"
          port: 443
          protocol: "HTTPS"
          sni: "httpbin.org"
    - host: "customer-a.example.com"
      origins:
        - address: "54.159.186.149"
          port: 443
          protocol: "HTTPS"
          sni: "httpbin.org"
  health_check_path: "/status/200"
  timeout_ms: 5000

control_plane:
  enabled: false
  endpoint: "http://127.0.0.1:9091"
  pop_id: "singapore"
  poll_interval_secs: 30

rate_limit:
  enabled: true
  requests_per_second: 100
  burst_capacity: 200

waf:
  enabled: true
  block_sqli: true
  block_xss: true
  block_path_traversal: true

cache:
  enabled: true
  default_ttl_seconds: 60
  max_entries: 10000
