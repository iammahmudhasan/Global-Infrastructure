services:
  config-controller:
    build:
      context: ../services/edge/config-controller
      dockerfile: Dockerfile
    container_name: nexusedge-config-controller
    ports:
      - "127.0.0.1:9091:9091"
    environment:
      - PORT=9091
      # Development profile flags: set NEXUSEDGE_DEV_MODE=false and NEXUSEDGE_ENV=production for production deployments
      - NEXUSEDGE_DEV_MODE=true
      - NEXUSEDGE_ENV=development
      - NEXUSEDGE_ACME_HOST=config-controller
      - NEXUSEDGE_ACME_PORT=9091
      - NEXUSEDGE_CERTS_DIR=/etc/envoy/certs
      - NEXUSEDGE_CERTS_GID=${ENVOY_CERT_GID:-101}
    volumes:
      - ./envoy/certs:/etc/envoy/certs:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/healthz || wget -qO- http://127.0.0.1:9091/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      nexusedge-net:
        ipv4_address: 172.28.0.3
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: nexusedge-envoy-ingress
    ports:
      - "${ENVOY_HTTP_PORT:-80}:10000"
      - "${ENVOY_HTTPS_PORT:-443}:10443"
    group_add:
      - "${ENVOY_CERT_GID:-101}"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/certs:/etc/envoy/certs:ro
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--service-node", "nexusedge-envoy-ingress", "--service-cluster", "nexusedge-edge-cluster"]
    depends_on:
      config-controller:
        condition: service_started
      nexusedge-gateway:
        condition: service_healthy
    networks:
      nexusedge-net:
        ipv4_address: 172.28.0.2
    restart: unless-stopped

  nexusedge-gateway:
    build:
      context: ../dataplane/edge/gateway
      dockerfile: Dockerfile
    container_name: nexusedge-pop-01
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - RUST_LOG=info
      - NEXUSEDGE_DEV_MODE=true
      - NEXUSEDGE_ENV=development
      - NEXUSEDGE_CP_ENABLED=true
      - NEXUSEDGE_CP_ENDPOINT=http://config-controller:9091
      - NEXUSEDGE_CP_POP_ID=singapore
      - NEXUSEDGE_CP_POLL_INTERVAL_SECS=10
      - NEXUSEDGE_CP_AUTH_TOKEN=dev-fixture-key-01
    volumes:
      - ../dataplane/edge/gateway/gateway.yaml:/app/gateway.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      nexusedge-net:
        ipv4_address: 172.28.0.4
    restart: unless-stopped

  mock-origin:
    build:
      context: ./mock-origin
      dockerfile: Dockerfile
    container_name: mock-origin-app
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    networks:
      nexusedge-net:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

networks:
  nexusedge-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
