# NexusEdge Envoy Edge Proxy Configuration
# Battle-tested L7 Ingress Gateway fronting the custom Rust fast-path and origins

static_resources:
  listeners:
  - name: edge_ingress_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: global_edge_vhost
              domains: ["*"]
              routes:
              # Fast-path Route: Dynamic Edge Function / Wasm Execution
              - match:
                  prefix: "/edge/"
                route:
                  cluster: rust_fast_path_cluster
                  timeout: 2s
              # Default Ingress Route: Workload Traffic Controller
              - match:
                  prefix: "/"
                route:
                  cluster: control_plane_cluster
                  timeout: 10s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # Upstream Cluster 1: NexusEdge Custom Rust Fast-Path Engine
  - name: rust_fast_path_cluster
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: rust_fast_path_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: nexusedge-gateway
                port_value: 8080

  # Upstream Cluster 2: NexusEdge Go Control Plane & Workload Dispatcher
  - name: control_plane_cluster
    connect_timeout: 0.5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: control_plane_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: config-controller
                port_value: 9091

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
