# NexusEdge Envoy Edge Proxy Configuration
# Industrial L7 Ingress Gateway fronting the custom Rust Data Plane and Origins
# Architecture:
# - Ingress Listener 1: Port 10000 (HTTP / ACME HTTP-01 challenge)
# - Ingress Listener 2: Port 10443 (HTTPS / TLS termination)
# - All customer traffic (prefix: "/") routes directly to Rust Data Plane (nexusedge-gateway:8080)
# - Control Plane management APIs are decoupled and NOT exposed on public customer ingress
# - ACME challenges (prefix: "/.well-known/acme-challenge/") route to config-controller:9091

node:
  id: nexusedge-envoy-ingress
  cluster: nexusedge-edge-cluster

static_resources:
  listeners:
  # Listener 1: HTTP Ingress (Port 10000 -> Public 80)
  - name: edge_http_ingress_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          use_remote_address: true
          xff_num_trusted_hops: 0
          route_config:
            name: customer_http_route
            virtual_hosts:
            - name: dashboard_http_vhost
              domains: ["dashboard.aeitron.com", "dashboard.aeitron.com:*"]
              routes:
              - match:
                  prefix: "/.well-known/acme-challenge/"
                route:
                  cluster: control_plane_cluster
                  timeout: 5s
              - match:
                  prefix: "/"
                redirect:
                  https_redirect: true
                  response_code: MOVED_PERMANENTLY
            - name: customer_http_vhost
              domains: ["*"]
              request_headers_to_add:
              - header:
                  key: "x-forwarded-proto"
                  value: "http"
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              routes:
              # ACME HTTP-01 Challenge Validation route to Control Plane
              - match:
                  prefix: "/.well-known/acme-challenge/"
                route:
                  cluster: control_plane_cluster
                  timeout: 5s
              # Block public exposure of internal telemetry/metrics endpoint
              - match:
                  path: "/metrics"
                direct_response:
                  status: 403
                  body:
                    inline_string: "Forbidden: internal metrics endpoint\n"
              # All customer traffic routes directly to Rust Data Plane Gateway
              - match:
                  prefix: "/"
                route:
                  cluster: rust_fast_path_cluster
                  timeout: 30s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # Listener 2: HTTPS Ingress (Port 10443 -> Public 443 with TLS termination)
  - name: edge_https_ingress_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10443
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            alpn_protocols:
            - "h2"
            - "http/1.1"
            tls_certificate_sds_secret_configs:
            - name: "dynamic_server_cert"
              sds_config:
                path_config_source:
                  path: "/etc/envoy/certs/sds.json"
                  watched_directory:
                    path: "/etc/envoy/certs"
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_https
          codec_type: AUTO
          http2_protocol_options:
            max_concurrent_streams: 100
            initial_stream_window_size: 65536
            initial_connection_window_size: 1048576
          use_remote_address: true
          xff_num_trusted_hops: 0
          route_config:
            name: customer_https_route
            virtual_hosts:
            - name: dashboard_https_vhost
              domains: ["dashboard.aeitron.com", "dashboard.aeitron.com:*"]
              request_headers_to_add:
              - header:
                  key: "x-forwarded-proto"
                  value: "https"
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: dashboard_cluster
                  timeout: 30s
            - name: customer_https_vhost
              domains: ["*"]
              request_headers_to_add:
              - header:
                  key: "x-forwarded-proto"
                  value: "https"
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              routes:
              # Block public exposure of internal telemetry/metrics endpoint
              - match:
                  path: "/metrics"
                direct_response:
                  status: 403
                  body:
                    inline_string: "Forbidden: internal metrics endpoint\n"
              # All customer HTTPS traffic routes directly to Rust Data Plane Gateway
              - match:
                  prefix: "/"
                route:
                  cluster: rust_fast_path_cluster
                  timeout: 30s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # Upstream Cluster 1: NexusEdge Custom Rust Fast-Path Engine
  - name: rust_fast_path_cluster
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: rust_fast_path_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: nexusedge-gateway
                port_value: 8080

  # Upstream Cluster 2: NexusEdge Go Control Plane (ACME HTTP-01 and Control API internal)
  - name: control_plane_cluster
    connect_timeout: 0.5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: control_plane_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: config-controller
                port_value: 9091

  # Upstream Cluster 3: NexusEdge Operator Dashboard (Authenticated BFF)
  - name: dashboard_cluster
    connect_timeout: 0.5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: dashboard_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: dashboard
                port_value: 3000

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
