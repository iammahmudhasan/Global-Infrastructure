version: '3'

tasks:
  default:
    cmds:
      - task: check

  fmt:
    desc: Auto-format all Go and Rust source code
    cmds:
      - cmd: cd services/edge/config-controller && gofmt -w .
      - cmd: cd services/network/global-router && gofmt -w .
      - cmd: cargo fmt --manifest-path dataplane/edge/gateway/Cargo.toml --all

  verify-ci:
    desc: Execute 100% Pre-Push CI Parity Suite matching GitHub Actions
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File tools/ci/verify-ci.ps1

  check:
    desc: Run compiler and lint checks across all planes
    cmds:
      - cmd: cd dataplane/edge/gateway && cargo check
      - cmd: python intelligence/scheduling/workload-scheduler/optimizer.py

  build:
    desc: Build core binaries
    cmds:
      - cmd: cd dataplane/edge/gateway && cargo build --release

  gateway:
    desc: Launch local Edge Data Plane gateway
    cmds:
      - cmd: cd dataplane/edge/gateway && cargo run

  router:
    desc: Launch local Global Router service
    cmds:
      - cmd: cd services/network/global-router && go run cmd/global-router/main.go
