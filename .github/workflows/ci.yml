name: NexusEdge CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-control-plane:
    name: Go Verification (${{ matrix.service }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexusedge
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: nexusedge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/edge/config-controller
          - services/network/global-router
          - apps/cli
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Go Format Check
        run: |
          cd ${{ matrix.service }}
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Vet
        run: |
          cd ${{ matrix.service }}
          go vet ./...

      - name: Run Go Tests
        env:
          NEXUSEDGE_TEST_DATABASE_URL: postgres://nexusedge:testpassword@localhost:5432/nexusedge_test?sslmode=disable
        run: |
          cd ${{ matrix.service }}
          go test -v -race ./...

  rust-data-plane:
    name: Rust Data Plane Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Format Check
        run: cargo fmt --manifest-path dataplane/edge/gateway/Cargo.toml --all -- --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path dataplane/edge/gateway/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust Check
        run: cargo check --manifest-path dataplane/edge/gateway/Cargo.toml

      - name: Rust Test
        run: cargo test --manifest-path dataplane/edge/gateway/Cargo.toml -- --nocapture

  python-intelligence:
    name: Python Intelligence Schedulers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Workload Optimizer
        run: python intelligence/scheduling/workload-scheduler/optimizer.py

  dashboard-bff:
    name: Dashboard BFF Security & Acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Dashboard Security Tests
        run: |
          cd apps/dashboard
          node --test test/bff.test.js

  deploy-manifest-check:
    name: Single-PoP End-to-End Compose Runtime
    runs-on: ubuntu-latest
    env:
      ENVOY_CERT_GID: "101"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Generate Ingress and Database TLS Certificates
        run: |
          go run tools/release/generate_certs.go deploy/envoy/certs deploy/postgres/certs
          sudo groupadd -g "$ENVOY_CERT_GID" envoy 2>/dev/null || true
          sudo chgrp -R "$ENVOY_CERT_GID" deploy/envoy/certs 2>/dev/null || true
          chmod 0775 deploy/envoy/certs
          chmod 0664 deploy/envoy/certs/server.crt deploy/envoy/certs/sds.json
          chmod 0660 deploy/envoy/certs/server.key
          sudo chmod 0755 deploy/postgres/certs
          sudo chmod 0644 deploy/postgres/certs/postgres.crt deploy/postgres/certs/root.crt
          sudo chmod 0600 deploy/postgres/certs/postgres.key
          sudo chown -R 70:70 deploy/postgres/certs 2>/dev/null || true

      - name: Validate Compose Configs (Dev & Prod)
        env:
          POSTGRES_USER: "nexusedge"
          POSTGRES_PASSWORD: "prodpassword123"
          NEXUSEDGE_DATABASE_URL: "postgres://nexusedge:prodpassword123@172.30.0.5:5432/nexusedge_edge?sslmode=require"
          AUDIT_HMAC_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXUSEDGE_SECRET_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
          NEXUSEDGE_CP_AUTH_TOKEN: "ci-token-01"
          NEXUSEDGE_API_KEYS: "ci-operator-key:ci-tenant:proj-core:PLATFORM_OPERATOR,ci-node-key:ci-tenant:proj-core:EDGE_NODE:pop-sin-01:singapore"
          NEXUSEDGE_OPERATOR_TOKEN: "ci-operator-token-test-2026"
          CONTROL_PLANE_SERVICE_TOKEN: "ci-operator-key"
          NEXUSEDGE_PROJECT_AI_KEYS: "proj-core:ci-key"
          NEXUSEDGE_AI_API_KEYS: "ci-key:ci-tenant:proj-core:proj-core:inference:GLOBAL"
          NEXUSEDGE_CP_POP_ID: "singapore"
          NEXUSEDGE_PUBLIC_IP: "80.225.241.129"
        run: |
          docker compose -f deploy/docker-compose.yml config
          docker compose -f deploy/docker-compose.prod.yml config

      - name: Verify Production PostgreSQL TLS Startup & Handshake
        env:
          POSTGRES_USER: "nexusedge"
          POSTGRES_PASSWORD: "prodpassword123"
          POSTGRES_DB: "nexusedge_edge"
          NEXUSEDGE_DATABASE_URL: "postgres://nexusedge:prodpassword123@172.30.0.5:5432/nexusedge_edge?sslmode=require"
          AUDIT_HMAC_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXUSEDGE_SECRET_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
          NEXUSEDGE_CP_AUTH_TOKEN: "ci-token-01"
          NEXUSEDGE_API_KEYS: "ci-operator-key:ci-tenant:proj-core:PLATFORM_OPERATOR,ci-node-key:ci-tenant:proj-core:EDGE_NODE:pop-sin-01:singapore"
          NEXUSEDGE_OPERATOR_TOKEN: "ci-operator-token-test-2026"
          CONTROL_PLANE_SERVICE_TOKEN: "ci-operator-key"
          NEXUSEDGE_PROJECT_AI_KEYS: "proj-core:ci-key"
          NEXUSEDGE_AI_API_KEYS: "ci-key:ci-tenant:proj-core:proj-core:inference:GLOBAL"
          NEXUSEDGE_CP_POP_ID: "singapore"
          NEXUSEDGE_PUBLIC_IP: "80.225.241.129"
        run: |
          echo "Starting Production PostgreSQL with server-side TLS..."
          docker compose -f deploy/docker-compose.prod.yml up -d postgres
          
          echo "Waiting for PostgreSQL container to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' nexusedge-postgres-prod 2>/dev/null || echo '"unknown"')
            if [ "$STATUS" = '"healthy"' ]; then
              echo "Production PostgreSQL is healthy with TLS!"
              break
            fi
            sleep 1
          done

          if [ "$STATUS" != '"healthy"' ]; then
            echo "ERROR: PostgreSQL failed to become healthy. Container logs:"
            docker compose -f deploy/docker-compose.prod.yml logs postgres
            exit 1
          fi

          echo "Testing TLS connection handshake (sslmode=require)..."
          docker compose -f deploy/docker-compose.prod.yml exec -T postgres psql "postgresql://nexusedge:prodpassword123@127.0.0.1:5432/nexusedge_edge?sslmode=require" -c "SHOW ssl;"

          echo "Testing full TLS certificate verification (sslmode=verify-full)..."
          docker compose -f deploy/docker-compose.prod.yml exec -T postgres psql "postgresql://nexusedge:prodpassword123@localhost:5432/nexusedge_edge?sslmode=verify-full&sslrootcert=/etc/ssl/certs/postgres.crt" -c "SELECT 'TLS_VERIFIED' as status, version();"

          echo "Tearing down production test container..."
          docker compose -f deploy/docker-compose.prod.yml down -v

      - name: Build and Start Single-PoP Stack
        env:
          ENVOY_CERT_GID: "101"
        run: |
          sudo systemctl stop nginx apache2 2>/dev/null || true
          for i in 1 2 3; do
            echo "Building containers (attempt $i/3)..."
            if [ "$i" -gt 1 ]; then
              echo "Retrying build with Docker Hub official mirrors (fallback from Public ECR)..."
              export CC_GOLANG_IMAGE="docker.io/library/golang:1.23-alpine"
              export CC_RUNTIME_IMAGE="docker.io/library/alpine:3.20"
              export GW_RUST_IMAGE="docker.io/library/rust:1-bookworm"
              export GW_RUNTIME_IMAGE="docker.io/library/debian:bookworm-slim"
              export MO_GOLANG_IMAGE="docker.io/library/golang:1.23-alpine"
              export MO_RUNTIME_IMAGE="docker.io/library/alpine:3.20"
            fi
            if docker compose -f deploy/docker-compose.yml build --progress=plain; then
              BUILD_SUCCESS=1
              break
            fi
            echo "Build failed. Retrying in 10s..."
            sleep 10
          done
          [ "${BUILD_SUCCESS:-0}" -eq 1 ] || { echo "ERROR: Docker build failed after 3 attempts"; exit 1; }

          for i in 1 2 3 4 5; do
            echo "Pulling Envoy ingress image (attempt $i/5)..."
            if docker pull envoyproxy/envoy:v1.32-latest; then
              PULL_SUCCESS=1
              break
            fi
            echo "Envoy pull timed out or failed. Retrying in 10s..."
            sleep 10
          done
          [ "${PULL_SUCCESS:-0}" -eq 1 ] || { echo "ERROR: Failed to pull envoyproxy/envoy:v1.32-latest"; exit 1; }

          for i in 1 2 3; do
            echo "Starting compose stack (attempt $i/3)..."
            if docker compose -f deploy/docker-compose.yml up -d; then
              UP_SUCCESS=1
              break
            fi
            echo "Compose up failed. Retrying in 5s..."
            sleep 5
          done
          [ "${UP_SUCCESS:-0}" -eq 1 ] || { echo "ERROR: Failed to start compose stack"; exit 1; }

      - name: Wait for Stack Health and Readiness
        timeout-minutes: 5
        run: |
          echo "Awaiting Config Controller health..."
          CC_READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9091/healthz > /dev/null 2>&1; then
              echo "Config Controller is healthy!"
              CC_READY=1
              break
            fi
            sleep 2
          done
          if [ "$CC_READY" -ne 1 ]; then
            echo "ERROR: Config Controller failed to become healthy within timeout!"
            exit 1
          fi

          echo "Awaiting Gateway /ready endpoint (initial snapshot sync)..."
          GW_READY=0
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ready || true)
            if [ "$STATUS" = "200" ]; then
              echo "Gateway is ready (HTTP 200)!"
              GW_READY=1
              break
            fi
            echo "Gateway not ready yet (status: $STATUS), waiting..."
            sleep 2
          done
          if [ "$GW_READY" -ne 1 ]; then
            echo "ERROR: Gateway failed to reach readiness (HTTP 200) within timeout!"
            exit 1
          fi

          echo "Awaiting Envoy Ingress readiness..."
          ENVOY_READY=0
          for i in {1..30}; do
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" -H "Host: api.nexusedge.io" http://127.0.0.1:80/get || true)
            if [ "$STATUS" = "200" ]; then
              echo "Envoy Ingress is ready (HTTP 200)!"
              ENVOY_READY=1
              break
            fi
            sleep 2
          done
          [ "$ENVOY_READY" -eq 1 ] || { echo "ERROR: Envoy failed to reach readiness (HTTP 200) within timeout!"; exit 1; }

      - name: Run Single-PoP E2E Integration Suite
        run: bash tests/e2e/test_single_pop_gateway.sh

      - name: Inspect Container Logs on Failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs

      - name: Teardown Compose Stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
