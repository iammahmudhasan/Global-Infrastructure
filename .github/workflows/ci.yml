name: NexusEdge CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-control-plane:
    name: Go Verification (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/edge/config-controller
          - services/network/global-router
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Go Format Check
        run: |
          cd ${{ matrix.service }}
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Vet
        run: |
          cd ${{ matrix.service }}
          go vet ./...

      - name: Run Go Tests
        run: |
          cd ${{ matrix.service }}
          go test -v -race ./...

  rust-data-plane:
    name: Rust Data Plane Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Format Check
        run: cargo fmt --manifest-path dataplane/edge/gateway/Cargo.toml --all -- --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path dataplane/edge/gateway/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust Check
        run: cargo check --manifest-path dataplane/edge/gateway/Cargo.toml

      - name: Rust Test
        run: cargo test --manifest-path dataplane/edge/gateway/Cargo.toml -- --nocapture

  python-intelligence:
    name: Python Intelligence Schedulers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Workload Optimizer
        run: python intelligence/scheduling/workload-scheduler/optimizer.py

  deploy-manifest-check:
    name: Single-PoP End-to-End Compose Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Generate Ingress TLS Certificates
        env:
          ENVOY_CERT_GID: "101"
        run: |
          go run tools/release/generate_certs.go deploy/envoy/certs
          sudo groupadd -g "$ENVOY_CERT_GID" envoy 2>/dev/null || true
          sudo chgrp "$ENVOY_CERT_GID" deploy/envoy/certs/server.key 2>/dev/null || chgrp "$ENVOY_CERT_GID" deploy/envoy/certs/server.key 2>/dev/null || true
          chmod 0755 deploy/envoy/certs
          chmod 0644 deploy/envoy/certs/server.crt deploy/envoy/certs/sds.json
          chmod 0640 deploy/envoy/certs/server.key

      - name: Validate Compose Config
        env:
          ENVOY_CERT_GID: "101"
        run: docker compose -f deploy/docker-compose.yml config

      - name: Build and Start Single-PoP Stack
        env:
          ENVOY_CERT_GID: "101"
        run: |
          sudo systemctl stop nginx apache2 2>/dev/null || true
          docker compose -f deploy/docker-compose.yml build --progress=plain
          docker compose -f deploy/docker-compose.yml up -d

      - name: Wait for Stack Health and Readiness
        timeout-minutes: 5
        run: |
          echo "Awaiting Config Controller health..."
          CC_READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9091/healthz > /dev/null 2>&1; then
              echo "Config Controller is healthy!"
              CC_READY=1
              break
            fi
            sleep 2
          done
          if [ "$CC_READY" -ne 1 ]; then
            echo "ERROR: Config Controller failed to become healthy within timeout!"
            exit 1
          fi

          echo "Awaiting Gateway /ready endpoint (initial snapshot sync)..."
          GW_READY=0
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ready || true)
            if [ "$STATUS" = "200" ]; then
              echo "Gateway is ready (HTTP 200)!"
              GW_READY=1
              break
            fi
            echo "Gateway not ready yet (status: $STATUS), waiting..."
            sleep 2
          done
          if [ "$GW_READY" -ne 1 ]; then
            echo "ERROR: Gateway failed to reach readiness (HTTP 200) within timeout!"
            exit 1
          fi

          echo "Awaiting Envoy Ingress readiness..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' nexusedge-envoy-ingress 2>/dev/null || true)
            if [ "$STATUS" = "healthy" ]; then
              echo "Envoy Ingress is healthy!"
              break
            fi
            sleep 2
          done
          [ "${STATUS:-}" = "healthy" ] || { echo "ERROR: Envoy failed to become healthy within timeout!"; exit 1; }

      - name: Run Single-PoP E2E Integration Suite
        run: bash tests/e2e/test_single_pop_gateway.sh

      - name: Inspect Container Logs on Failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs

      - name: Teardown Compose Stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
