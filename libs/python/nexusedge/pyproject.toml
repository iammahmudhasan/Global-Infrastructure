[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusedge"
version = "0.1.0"
description = "Official Python SDK for NexusEdge Global Infrastructure & Multi-Objective AI Orchestration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "NexusEdge Team", email = "platform@nexusedge.io" }
]
keywords = ["nexusedge", "edge", "ai", "inference", "anycast", "bdix", "latency"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.urls]
Homepage = "https://nexusedge.io"
Documentation = "https://dashboard.aeitron.com"
Repository = "https://github.com/iammahmudhasan/Global-Infrastructure"
