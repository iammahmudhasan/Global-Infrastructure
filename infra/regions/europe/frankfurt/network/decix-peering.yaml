# NexusEdge Global Infrastructure - Region Network Specification
# Region: europe-west3 (Frankfurt, Germany)
# Peering Authority: Deutscher Commercial Internet Exchange (DE-CIX Frankfurt)
# Compliance: European Union General Data Protection Regulation (GDPR) Art 44-50
# Status: SIMULATION_TESTBED / PROPOSED_SPECIFICATION (RFC 5737 / RFC 3849 / RFC 6996)

apiVersion: infrastructure.nexusedge.io/v1alpha1
kind: PeeringPolicy
metadata:
  name: decix-peering-frankfurt
  labels:
    region: europe-west3
    city: frankfurt
    country: de
    datacenter: equinix-fr5
    compliance: eu-gdpr
spec:
  tier: "SIMULATION_TESTBED"
  status: "PROPOSED_SPECIFICATION"
  rfc_disclaimer:
    ipv4: "Prefix 198.51.100.0/24 is reserved for documentation/testbeds under RFC 5737 (TEST-NET-2); not routeable on public Internet."
    ipv6: "Prefix 2001:db8:de::/48 is reserved for documentation under RFC 3849; not routeable on public Internet."
    asn: "ASN 64512 is reserved for private use under RFC 6996; not a globally unique public ASN."
  local_asn: 64512
  route_servers:
    - asn: 6695
      name: "DE-CIX Route Server 01"
      ipv4_peer: "198.51.100.245"
      ipv6_peer: "2001:db8:de::1"
      status: SIMULATION_STANDBY
      max_prefixes: 30000
    - asn: 6695
      name: "DE-CIX Route Server 02 (Redundant)"
      ipv4_peer: "198.51.100.244"
      ipv6_peer: "2001:db8:de::2"
      status: SIMULATION_STANDBY
      max_prefixes: 30000

  advertised_prefixes:
    ipv4:
      - "198.51.100.0/24"
    ipv6:
      - "2001:db8:de::/48"

  routing_policy:
    local_preference: 180
    med: 15
    community_tags:
      - "64512:1003" # Pan-European Transit
      - "64512:4001" # EU-GDPR Sovereign Zone
    target_regional_latency_ms: 14.0

  subsea_transit_links:
    - cable_system: "TAT-14 / Transatlantic Subsea"
      remote_pop: "virginia"
      capacity_gbps: 50000
      sla_rtt_ms: 78.0
      status: ACTIVE_INTERCONNECT
    - cable_system: "Asia Africa Europe-1 (AAE-1)"
      remote_pop: "singapore"
      capacity_gbps: 20000
      sla_rtt_ms: 145.0
      status: ACTIVE_INTERCONNECT
    - cable_system: "SMW6 Terrestrial Extension"
      remote_pop: "dhaka"
      capacity_gbps: 15000
      sla_rtt_ms: 125.0
      status: ACTIVE_INTERCONNECT
